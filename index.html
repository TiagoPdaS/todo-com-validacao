<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Formularios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee+Tint&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/favicon.ico"> <!-- Adicionado favicon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
</head>

<body>

    <div class="screen">
        <div class="leftside">
            <img src="images/logo.png" alt="">
        </div>
        <div class="rightside">
            <div class="form-container animate__animated">
                <h1 class="titulo-login"> Crie uma Conta</h1>

                <form method="GET" action="cadastro.html" class="validator">
                    <label for="">
                        Seu Nome: <br>
                        <input type="text" name="nome" data-rules="required">
                    </label>

                    <label for="">
                        Seu Email: <br>
                        <input type="text" name="email" id="email" data-rules="required|email">
                    </label>

                    <label for="">
                        Sua Senha: <br>
                        <input type="password" name="password" id="password" data-rules="required|min=6"
                            autocomplete="current-password"> <!-- Adicionado autocomplete -->
                    </label>

                    <label for="">
                        Confirme sua Senha: <br>
                        <input type="password" name="confirm_password" id="confirm_password"
                            data-rules="required|match=password">
                    </label>

                    <button class="btn-cadastro" type="submit">Cadastrar</button>
                </form>

                <div>
                    Ja tem uma Conta? <br><br>
                    <a href="#" id="toggle-login" class="btn-login">
                        <span1>Faça seu Login</span1>
                    </a>
                </div>
            </div>

            <div id="login-form" class="animate__animated" style="display: none;">
                <h1 class="titulo-login">Login</h1>
                <form id="login" class="validator">
                    <label for="">
                        Seu Email: <br>
                        <input type="text" name="login_email" id="login_email" data-rules="required|email">
                    </label>

                    <label for="">
                        Sua Senha: <br>
                        <input type="password" name="login_password" id="login_password" data-rules="required">
                    </label>

                    <button class="btn-cadastro" type="button" id="login-button">Entrar</button>



                </form>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
